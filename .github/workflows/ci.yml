name: AeroSphinx CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The repository's own floor (PEP 604 unions in the source).
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  test:
    name: Python tests, lint and scientific gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Byte-compile every module
        run: python -m compileall -q src scripts tests api

      - name: Lint
        run: |
          python -m ruff check src scripts tests api
          python -m black --check src scripts tests api
          python -m isort --check-only src scripts tests api

      - name: Unit and integration tests
        run: python -m pytest tests/ -q

      - name: Phase 6 availability gate
        # Exits non-zero when the fused frame violates the availability contract.
        run: python scripts/run_phase6_fusion.py

      - name: Published numbers match the artefacts and the README
        run: python scripts/check_claims.py --verbose

      - name: Documentation links resolve
        run: python scripts/check_docs.py

      - name: Matrix still reproduces from this commit
        run: python scripts/check_reproducibility.py

      - name: Console script works
        run: |
          aerosphinx --version
          aerosphinx doctor

  ui:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docs:
    name: Documentation claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the package
        # The check imports the CLI to list its subcommands; no subprocess and
        # no reliance on PYTHONPATH survives a runner environment change.
        run: python -m pip install --quiet -e .

      - name: Check that documented commands exist
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          sys.path.insert(0, "src")
          from aerosphinx.cli import subcommands

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          makefile = pathlib.Path("Makefile").read_text(encoding="utf-8")

          # Every `make <target>` named in the README must exist in the Makefile.
          targets = set(re.findall(r"^([a-zA-Z][\w-]*):", makefile, re.MULTILINE))
          named = set(re.findall(r"^make ([\w-]+)", readme, re.MULTILINE))
          missing = sorted(named - targets)
          assert not missing, f"README names make targets that do not exist: {missing}"

          # Every `aerosphinx <command>` named in the README must be a real one.
          known = set(subcommands())
          unknown = sorted(c for c in set(re.findall(r"aerosphinx ([\w-]+)", readme)) if c not in known)
          assert not unknown, f"README names unknown commands: {unknown}"

          # The registry must parse.
          json.loads(pathlib.Path("results/CANONICAL.json").read_text())
          print(f"documentation claims verified: {len(targets)} make targets, {len(known)} commands")
          PY
