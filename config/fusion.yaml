# Phase 6 - multisource fusion and availability.
#
# These rules define how the environmental sources are joined onto the
# ground daily series. They exist as configuration because the availability
# policy is a scientific decision, not an implementation detail.

fusion:
  date_column: "Date"
  target: "PM25"

  # Sources fused onto the ground calendar, in a fixed order. The group
  # definitions and availability classes live in
  # src/aerosphinx/features/groups.py.
  sources: ["station_met", "merra", "aod"]

  # D-003 correction. A missing environmental observation is preserved as
  # NaN and flagged; nothing is carried forward, interpolated or imputed.
  missing_value_policy: "preserve"
  missing_value_note: >
    Missing environmental observations are preserved as NaN. No
    forward-fill, interpolation or imputation is permitted. Per-source
    <source>_observed flags and <source>_observation_age_days columns make
    the missingness visible instead of manufacturing a value.

  # A source counts as observed on a date when at least this many of its
  # measurement columns are non-null.
  min_observed_values_per_source: 1

  # AOD support counts are metadata, not measurements: an absent AOD
  # observation has zero supporting pixels and zero overpasses.
  support_counts_are_metadata: true

  # Track B comparisons need matched rows on identical dates. The threshold
  # is the one already used by the Workstream C group comparisons, reused
  # rather than re-invented.
  min_matched_rows_for_inference: 30
  min_matched_rows_rationale: >
    Same threshold as aerosphinx.tracks.workstream_c group comparisons. A
    source with fewer matched rows is reported but flagged as insufficient
    evidence; Phase 5's MERRA-2 group had 5 matched test rows and was
    declared untestable on that basis.
