[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosphinx"
version = "0.1.0"
description = "Availability-aware multisource PM2.5 estimation and forecasting platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AkshatGo" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
keywords = ["air-quality", "pm2.5", "aerosol-optical-depth", "merra-2", "insat-3d"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.6",
]

[project.scripts]
aerosphinx = "aerosphinx.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aerosphinx = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests spanning multiple modules",
    "scientific: tests that assert scientific or data-integrity properties",
]
filterwarnings = ["error::FutureWarning"]

# --- Formatting and lint ---------------------------------------------------
# ``legacy/`` is the frozen pre-Phase-0 research record and is deliberately
# excluded from every formatter: it must stay byte-identical to what produced
# the chapter's tables.
[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    legacy
  | ui
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["legacy", "ui", ".venv"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["legacy", "ui"]

[tool.ruff.lint]
# Keep the enforced rule set narrow and unambiguous: syntax/runtime errors
# and unused code. Stylistic choices are black's and isort's job.
select = ["E9", "F"]
ignore = []
